<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" type="image/png" href="assets/images/favicon.png" />
    <title>Mahi Mahatab</title>
</head>
<body>

    <!-- ID Card -->

    <div id="id-card-container" aria-hidden="true">
        <svg id="lanyard" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
            <line id="lanyard-line" />
        </svg>

        <div id="id-card" role="img" aria-label="ID card">
            <div class="card-inner">
                <div class="card-front">
                    <img src="assets/images/mahi.jpg" alt="Profile Picture" class="profile-pic">
                    <h3>Mahi Mahatab</h3>
                    <p>Burnside High School Student</p>
                    <div class="school-logo"><img src="assets/images/school-logo.png" alt="school logo"></div>
                </div>

                <div class="card-back" aria-hidden="true">
                </div>
            </div>
        </div>
    </div>

    <!-- The Terminal -->

    <main id="main_container">
        <div class="terminal" id="terminal">
            <section id="top_bar">
                <p id="bar-user">&copy; mahi@ubuntu: ~ </p>

                <div id="hint-bubble" class="hint-bubble" role="note" aria-live="polite">
                    <span>Type <b>"help"</b> to see available commands -- Right-click the ID card to flip it.</span>
                </div>

                <div id="top_buttons">
                    <button class="button">&#x2212;</button>
                    <button class="button">&#9723;</button>
                    <button class="button" id="exit">&#x2716;</button>
                </div>
            </section>

            <section id="body">
                <div id="prompt">
                    <span id="user">mahi@ubuntu:</span>
                    <span id="wavy">~</span>
                    <span id="dollar">$</span>
                    <span id="input" spellcheck="false"></span>
                    <span id="cursor"></span>
                </div>
            </section>
        </div>
    </main>

    <!-- Template code for id card, projects and tools to refer to in js-->

    <template id="id-card-back-template">
        <div class="back-header">
            <h3>Burnside High School</h3>
            <div class="school-id">SCHOOL ID: <strong>23691</strong></div>
        </div>
        <div class="back-content">
            <div class="back-photo">
                <img src="assets/images/mahi.jpg" alt="photo">
            </div>
            <div class="back-info">
                <div class="info-row"><span class="label">LEGAL NAME</span><span class="value">MD Mahatab Mahi</span></div>
                <div class="info-row"><span class="label">PREFERRED</span><span class="value">Mahi Mahatab</span></div>
                <div class="info-row"><span class="label">DOB</span><span class="value">26 Oct 2009</span></div>
                <div class="info-row"><span class="label">AGE</span><span class="value">15</span></div>
                <div class="info-row"><span class="label">YEAR</span><span class="value">11</span></div>
                <div class="info-row"><span class="label">NSN</span><span class="value">0168531528</span></div>
            </div>
        </div>
        <div class="back-footer">
            <img src="assets/images/school-logo.png" alt="school logo" class="footer-logo">
        </div>
    </template>

    <template id="project-card-template">
        <div class="project-card">
            <img src="" alt="" class="project-image">
            <div class="title"></div>
            <div class="desc"></div>
            <div class="link"><a href="" target="_blank" rel="noopener noreferrer">View project ↗</a></div>
        </div>
    </template>

    <template id="tool-card-template">
        <div class="tool-card">
            <img src="" alt="" class="tool-image">
            <div class="tool-name"></div>
        </div>
    </template>

    <script src="js/script.js"></script>
</body>
</html>
