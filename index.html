<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css" >
    <title>Terminal</title>
</head>
<body>

    <!-- Interactive Hanging ID Card (added) -->
    <div id="id-card-container" aria-hidden="true">
        <svg id="lanyard" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
            <line id="lanyard-line" />
        </svg>

        <!-- NOTE: card-inner handles the 3D flip; #id-card is still positioned/rotated by physics -->
        <div id="id-card" role="img" aria-label="ID card">
            <div class="card-inner">
                <div class="card-front">
                    <!-- <div class="id-header">
                        <img src="assets/logo.png" alt="Logo" class="card-logo">
                    </div> -->

                    <img src="assets/images/mahi.jpg" alt="Profile Picture" class="profile-pic">
                    <h3>Mahi Mahatab</h3>
                    <p>Aspiring Software Engineer</p>
                    <div class="barcode"></div>
                </div>

                <div class="card-back" aria-hidden="true">
                    <h3>More about Mahi</h3>
                    <p>Interests: AI, embedded systems, web & game dev.</p>
                    <p style="margin-top:6px;">Contact:</p>
                    <p style="font-size:13px; word-break:break-word;">
                        <a href="mailto:md.mahatabmahimn@gmail.com" target="_blank">md.mahatabmahimn@gmail.com</a>
                    </p>
                    <p style="margin-top:8px; font-size:13px;">
                        GitHub: <a href="https://github.com/Astral-Viscount" target="_blank">Astral-Viscount</a>
                    </p>
                    <div class="back-barcode"></div>
                </div>
            </div>
        </div>
    </div>

    <main id="main_container">
        <div class="terminal" id="terminal">
            <section id="top_bar">
                <p id="bar-user">&copy mahi@ubuntu: ~   Type <b>"help"</b> to see the commads</p>

                <div id="top_buttons">
                    <button class="button">&#x2212;</button>
                    <button class="button">&#9723;</button>
                    <button class="button" id="exit">&#x2716;</button>
                </div>

            </section>

            <section id="body">
                <div id="prompt">
                    <span id="user">mahi@ubuntu:</span>
                    <span id="wavy">~</span>
                    <span id="dollar">$</span>
                    <span id="input" spellcheck="false"></span>
                    <span id="cursor"></span>
                </div>
            </section>
        </div>
    </main>
    <script src="js/script.js"></script>
</body>
</html>
