<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css" >
    <script src="js/script.js"></script>
    <title>Terminal</title>
</head>
<body>
    <main id="main_container">
        <div class="terminal">
            <section id="top_bar">
                <p id="bar-user">mahi@ubuntu: ~</p>

                <div id="top_buttons">
                    <button class="button">&#x2212;</button>
                    <button class="button">&#9723;</button>
                    <button class="button" id="exit">&#x2716;</button>
                </div>

            </section>

            <section id="body">
                <div id="prompt">
                    <span id="user">mahi@ubuntu:</span>
                    <span id="wavy">~</span>
                    <span id="dollar">$</span>
                    <span id="cursor"></span>
                </div>
            </section>
        </div>
    </main>
</body>
</html>
